<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" role="img" aria-labelledby="title desc">
<title id="title">One task, opposite questions</title><desc id="desc">At p = 0.60, more attempts raise capability coverage and lower all-success reliability.</desc>
